name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Verify scorecard from committed answers
        # Scoring is deterministic, so CI re-scores the committed raw eval
        # answers on every push and fails if the published 19/20 vs 5/20
        # could not be reproduced from them. No LLM key needed.
        run: npm run eval:verify
      - name: Production build
        run: npm run build
