name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        # Includes tests/prove-receipts.test.ts, which re-verifies the committed
        # end-to-end receipts: they must carry no failed check, cover every phase
        # of the loop, and say what the README says they say.
        #
        # That check re-reads an artifact. The one that re-derives it lives in
        # prove.yml, which boots a real DataHub, runs `npm run prove` on both
        # catalogs and fails if a fresh run disagrees with what is committed here.
        run: npm test
      - name: Verify scorecards from committed answers
        # Scoring is deterministic, so CI re-scores the committed raw eval
        # answers for BOTH suites on every push — Northbeam (19/20 vs 5/20) and
        # DataHub's own showcase-ecommerce datapack (20/20 vs 3/20) — and fails
        # if a published number could not be reproduced from them. No LLM key,
        # no DataHub instance needed: it is a pure re-run of the scorer.
        run: npm run eval:verify
      - name: Verify the drift benchmark table from the committed run
        # The benchmark itself mutates a real catalog, so CI cannot run it. It
        # can re-derive the published table from the committed run and fail if
        # the README, the scorecard and the artifact have come apart.
        run: npm run bench:verify
      - name: Production build
        run: npm run build
